<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>The Matrix</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <script>
        const canvas = document.getElementById("matrixCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        const katakana = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン";
        const latin = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const alphabet = katakana + latin;

        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let rainDrops = Array.from({ length: columns }).fill(1);

        // matrix.html?burst: already raining (a glitch shows it for a second)
        if (/burst/.test(location.search)) {
            const rows = Math.ceil(canvas.height / fontSize);
            rainDrops = rainDrops.map(function () { return Math.floor(Math.random() * rows); });
        }

        window.addEventListener("resize", () => {
            columns = Math.floor(canvas.width / fontSize);
            rainDrops = Array.from({ length: columns }).fill(1);
        });

        function render() {
            // Semi-transparent black fade to create the trailing rain effect
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        // Run at a fixed 30 FPS to minimize power consumption
        const interval = setInterval(render, 33);
        if (/burst/.test(location.search)) for (let i = 0; i < 40; i++) render();   // (trails already)

        // Notify parent window on user activity
        function emitActivity() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage("screensaver-wakeup", "*");
            }
        }
        ["mousemove", "mousedown", "keydown", "touchstart", "wheel"].forEach(function (evt) {
            window.addEventListener(evt, emitActivity, { passive: true });
        });
    </script>
</body>
</html>
