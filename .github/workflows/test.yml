# The game's automatic tests, on every upload (and on demand from the
# Actions tab: "Run workflow"). A red ✘ next to a commit means one failed;
# click it for which, and why. Both can be run at home too: see the top of
# test/run-tests.js and test/browser-smoke.js.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  game:
    name: Game tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22        # the simulator wants 22.8 or later
      - name: Files, events, seeded games, replays and balance
        run: node test/run-tests.js

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Play through the menus, the game and the Halls
        run: node test/browser-smoke.js
